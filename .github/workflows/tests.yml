name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.12

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: db_user
          POSTGRES_PASSWORD: db_password
          POSTGRES_DB: b2b_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      minio:
        image: minio/minio
        command: server /data
        env:
          MINIO_ROOT_USER: minio_admin
          MINIO_ROOT_PASSWORD: minio_password

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file for tests
      run: |
        echo "POSTGRES_SERVER=db" >> .env
        echo "POSTGRES_PORT=5432" >> .env
        echo "POSTGRES_USER=db_user" >> .env
        echo "POSTGRES_PASSWORD=db_password" >> .env
        echo "POSTGRES_DB=b2b_db" >> .env
        echo "MINIO_URL=minio:9000" >> .env
        echo "MINIO_ROOT_USER=minio_admin" >> .env
        echo "MINIO_ROOT_PASSWORD=minio_password" >> .env
        echo "MINIO_BUCKET=marketplace-images" >> .env
        echo "MINIO_ACCESS_KEY=minio_admin" >> .env
        echo "MINIO_SECRET_KEY=minio_password" >> .env
        echo "JWT_SECRET=test_secret_key" >> .env
        echo "JWT_ALGORITHM=HS256" >> .env
        echo "SERVICE_KEY=secret-service-key" >> .env
        echo "B2B_TO_MOD_KEY=secret-b2b-mod-key" >> .env

    - name: Run migrations
      run: |
        alembic upgrade head

    - name: Run tests
      run: |
        pytest
